<!-- Bouton pour afficher l'énigme -->
<button onclick="showEnigme()">Énigme</button>

<!-- Bloc de l'énigme -->
<div id="enigmeContainer" style="display: none; margin-top: 20px;">
  <p><strong>Voici l'énigme :</strong><br>
  Quelle est le vrai nom de Mikian Music ?<br>
  <em>Indice : Mikian est une programmeuse canadienne.</em></p>
  
  <form id="enigmeForm">
    <label for="user_email">Votre adresse e-mail :</label><br>
    <input type="email" name="user_email" required placeholder="ex : tonadresse@mail.com"><br><br>

    <label for="user_answer">Votre réponse :</label><br>
    <input type="text" name="user_answer" required placeholder="Tape ta réponse ici"><br><br>

    <button type="submit">Envoyer</button>
  </form>

  <p id="message" style="display: none;">✅ Merci ! Votre réponse a été envoyée avec succès.</p>
</div>

<!-- Script EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  function showEnigme() {
    document.getElementById("enigmeContainer").style.display = "block";
  }

  // Initialise EmailJS avec ta clé publique
  (function(){
    emailjs.init("HRBSuS_fO6WWQl7Mw");
  })();

  // Envoi du formulaire
  document.getElementById("enigmeForm").addEventListener("submit", function(event) {
    event.preventDefault();

    emailjs.sendForm("service_33xo0km", "template_jvfh7hz", this)
      .then(function() {
        document.getElementById("message").style.display = "block";
      }, function(error) {
        alert("❌ Erreur lors de l'envoi : " + JSON.stringify(error));
      });
  });
</script>
